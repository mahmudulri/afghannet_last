<!DOCTYPE html>
<html>

<head>
  <style>

    body{
      font-family: Arial;
      padding:20px;
    }

    .title{
      font-size:24px;
      font-weight:bold;
      margin-bottom:20px;
    }

    table{
      width:100%;
      border-collapse: collapse;
    }

    th, td{
      border:1px solid #ddd;
      padding:10px;
      text-align:left;
    }

  </style>
</head>

<body>

<div class="title">
  Invoice
</div>

<table>

<tr>
  <th>Name</th>
  <th>Qty</th>
  <th>Price</th>
</tr>

<tr>
  <td>Product 1</td>
  <td>2</td>
  <td>$120</td>
</tr>

</table>

</body>
</html>
